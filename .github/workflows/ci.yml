name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Editor tests
        run: npm test

      - name: Cloud save tests (Firestore emulator)
        run: npm run test:cloud

      - name: Engine tests (headless browser)
        run: npm run test:engine

      - name: Build
        run: npm run build

      - name: Smoke test of the build (headless browser)
        run: npm run test:smoke
